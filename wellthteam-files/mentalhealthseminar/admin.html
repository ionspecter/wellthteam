<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP Admin — Mental Health Seminar</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --green-deep:#173a26; --gold:#c9a227; --cream:#faf6ec; --cream-2:#f2ecdc; --ink:#1c2621; --line:rgba(23,58,38,0.14); }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--cream); color:var(--ink); font-family:'Poppins',sans-serif; }
  .wrap{ max-width: 1000px; margin:0 auto; padding: 40px 18px 60px; }
  h1{ font-family:'Playfair Display',serif; color:var(--green-deep); }
  .card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:24px; box-shadow:0 12px 28px rgba(23,58,38,0.1); }
  .lock{ max-width:380px; margin:60px auto; text-align:center; }
  input{ width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line); background:var(--cream-2); font-size:1rem; margin:12px 0; }
  button{ background:var(--green-deep); color:#fdf7e4; border:none; padding:12px 20px; border-radius:10px; font-weight:600; cursor:pointer; }
  .ghost{ background:transparent; border:1.5px solid var(--line); color:var(--ink); }
  .actions{ display:flex; gap:10px; flex-wrap:wrap; margin:14px 0; }
  table{ width:100%; border-collapse:collapse; font-size:0.86rem; }
  th,td{ text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th{ color:var(--green-deep); font-size:0.76rem; }
  .table-scroll{ overflow-x:auto; }
  .pill{ display:inline-block; background:var(--cream-2); padding:4px 12px; border-radius:999px; font-weight:600; font-size:0.85rem; color:var(--green-deep); }
  .err{ color:#7a1f1f; font-size:0.85rem; min-height:1em; }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">

  <div id="lock" class="card lock">
    <h1>Admin access</h1>
    <p>Enter your site ADMIN_KEY to view Mental Health Seminar RSVPs.</p>
    <input type="password" id="key" placeholder="ADMIN_KEY">
    <button id="unlock">View responses</button>
    <div class="err" id="lockErr"></div>
  </div>

  <div id="panel" class="card hidden">
    <h1>Mental Health Seminar — RSVPs</h1>
    <span class="pill" id="count">0 responses</span>
    <div class="actions">
      <button class="ghost" id="refresh">↻ Refresh</button>
      <button class="ghost" id="csv">⬇ Download CSV</button>
      <button class="ghost" id="copyEmails">✉ Copy all emails</button>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Submitted</th><th>Name</th><th>Contact</th><th>Email</th><th>Attendees</th><th>Source</th><th>Message</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
(function(){
  var KEY_STORAGE = 'mh_admin_key';
  var rows = [];

  function esc(s){ var d=document.createElement('div'); d.textContent = s==null? "": String(s); return d.innerHTML; }

  async function load(key){
    var res = await fetch('/api/admin/rsvps', { headers: { 'X-Admin-Key': key } });
    if(!res.ok) throw new Error('unauthorized');
    var data = await res.json();
    rows = data.rsvps || [];
    render();
  }

  function render(){
    document.getElementById('count').textContent = rows.length + (rows.length===1?' response':' responses');
    var tbody = document.getElementById('tbody');
    if(rows.length===0){ tbody.innerHTML = '<tr><td colspan="7">No RSVPs yet.</td></tr>'; return; }
    tbody.innerHTML = rows.map(function(r){
      var when = r.created_at ? new Date(r.created_at.replace(' ','T')+'Z').toLocaleString() : '';
      return '<tr><td>'+esc(when)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.contact)+'</td><td>'+esc(r.email)+'</td><td>'+esc(r.attendees)+'</td><td>'+esc(r.source)+'</td><td>'+esc(r.message)+'</td></tr>';
    }).join('');
  }

  async function tryUnlock(){
    var key = document.getElementById('key').value.trim();
    if(!key) return;
    document.getElementById('lockErr').textContent = '';
    try{
      await load(key);
      sessionStorage.setItem(KEY_STORAGE, key);
      document.getElementById('lock').classList.add('hidden');
      document.getElementById('panel').classList.remove('hidden');
    }catch(e){
      document.getElementById('lockErr').textContent = 'Incorrect key, or the site is unreachable.';
    }
  }

  document.getElementById('unlock').addEventListener('click', tryUnlock);
  document.getElementById('key').addEventListener('keydown', function(e){ if(e.key==='Enter') tryUnlock(); });

  document.getElementById('refresh').addEventListener('click', function(){
    var key = sessionStorage.getItem(KEY_STORAGE);
    if(key) load(key).catch(function(){});
  });

  document.getElementById('copyEmails').addEventListener('click', async function(){
    var emails = rows.map(function(r){return r.email;}).filter(Boolean).join(', ');
    try{
      await navigator.clipboard.writeText(emails);
      this.textContent = '✓ Copied!';
      var self = this;
      setTimeout(function(){ self.textContent = '✉ Copy all emails'; }, 1600);
    }catch(e){}
  });

  document.getElementById('csv').addEventListener('click', function(){
    var header = ['Submitted','Name','Contact','Email','Attendees','Source','Message'];
    var lines = [header.join(',')];
    rows.forEach(function(r){
      var when = r.created_at ? new Date(r.created_at.replace(' ','T')+'Z').toLocaleString() : '';
      var row = [when, r.name, r.contact, r.email, r.attendees, r.source, r.message].map(function(v){
        v = (v==null? "": String(v)).replace(/"/g,'""'); return '"'+v+'"';
      });
      lines.push(row.join(','));
    });
    var blob = new Blob([lines.join('\n')], {type:'text/csv'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'mental-health-seminar-rsvps.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // Auto-unlock if key already in this session
  var saved = sessionStorage.getItem(KEY_STORAGE);
  if(saved){
    document.getElementById('key').value = saved;
    tryUnlock();
  }
})();
</script>
</body>
</html>
